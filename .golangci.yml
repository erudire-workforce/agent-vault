version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - gocritic
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*encoding/json.Encoder).Encode
    gosec:
      excludes:
        - G101 # false positives on test data / credential key names
        - G104 # unhandled errors in tests — covered by errcheck exclusion for test files
        - G107 # variable URL in health check — intentional
        - G115 # uintptr→int in term.ReadPassword — safe on 64-bit
        - G204 # subprocess with variable — intentional exec wrapper / self-daemonize
        - G304 # file inclusion via variable — intentional pidfile / session reading
        - G704 # SSRF — this IS a proxy, SSRF is the feature
  exclusions:
    paths:
      - internal/server/webdist
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # Shared kmsaad test harness: kmsaad_backends_test.go is copied verbatim
      # into every package that runs store-backed tests (so some copies leave
      # helpers unused) and builds SQL from literal table names in test code;
      # the OAuth swap test runs a local token-endpoint fake. Scoped to those
      # test files and those findings only.
      - linters:
          - unused
        path: kmsaad_backends_test\.go
        text: "func testDB.fresh is unused"
      - linters:
          - gosec
        path: kmsaad_backends_test\.go
        text: "G202"
      - linters:
          - gosec
        path: kmsaad_oauth_swap_test\.go
        text: "G120"
      # internal/server kmsaad suites, untagged on integration: the env
      # harness keeps a reveal helper that write-only made unused, and the
      # OAuth log test's local token-endpoint fake parses the form unbounded
      # and echoes request fields on purpose (providers do).
      - linters:
          - unused
        path: internal/server/kmsaad_env_test\.go
        text: "func \\(\\*kenv\\)\\.reveal is unused"
      - linters:
          - gosec
        path: internal/server/kmsaad_policy_test\.go
        text: "G120|G705"
      # Identity review-fix tests: the local users/me fake builds its body
      # from the Authorization it received, on purpose (one digest per
      # credential value). Test code only.
      - linters:
          - gosec
        path: internal/server/reviewfix_identity_test\.go
        text: "G705"
      # Proxy review-fix tests: the echo-scrub upstream fakes write back the
      # credential they received, on purpose, to prove the proxy scrubs it.
      - linters:
          - gosec
        path: internal/mitm/reviewfix_proxy_test\.go
        text: "G705"
