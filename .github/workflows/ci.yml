name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Fork work branches run the full suite on push (no PR needed).
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter calls pulls.listFiles on PR events; without this scope
  # GitHub returns 403 and every PR's `changes` job fails closed.
  pull-requests: read

# Cancel in-flight runs on the same PR when a new commit is pushed.
# Main-branch runs are NOT cancelled (preserves post-merge signal).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      sdk_ts: ${{ steps.filter.outputs.sdk_ts }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            # Only gates `go-mod-tidy`. `go-test` and `go-lint` run on every
            # PR unconditionally, so they don't need embedded-asset paths
            # listed here.
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
              - '.github/workflows/ci.yml'
            sdk_ts:
              - 'sdks/sdk-typescript/**'
              - '.github/workflows/ci.yml'

  frontend-build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (tsc + vite)
        run: cd web && npm ci && npm run build

  # Security-critical: always run on every PR. Path-gating these would mean
  # a missed filter entry (e.g. a new //go:embed target) silently turns the
  # required check green with no Go signal. For a credential broker that's
  # too large a failure mode for the speedup it would buy.
  go-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # go:embed all:webdist needs the directory at compile time;
      # real Vite output is validated by the frontend-build job.
      - name: Stub webdist for go:embed
        run: |
          mkdir -p internal/server/webdist
          printf '<!doctype html><title>ci-stub</title>' > internal/server/webdist/index.html

      - name: Run tests
        run: go test -race -count=1 ./...

  # Fork policy tests (proxy rules, echo scrubbing, identity header,
  # whoami, netguard, declarative bootstrap) against both store backends.
  # The postgres subtests are required here, not skipped.
  go-test-proxy-policy:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      AGENT_VAULT_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:55432/postgres?sslmode=disable
      AGENT_VAULT_TEST_REQUIRE_POSTGRES: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Stub webdist for go:embed
        run: |
          mkdir -p internal/server/webdist
          printf '<!doctype html><title>ci-stub</title>' > internal/server/webdist/index.html

      - name: Untagged fork packages (postgres required)
        run: go test -race -count=1 -v ./internal/bootstrap/... ./internal/netguard/ ./internal/identity/ ./internal/scrub/ ./internal/servicepolicy/ ./internal/telemetry/

      # Tagged (kmsaad) tests in this branch's scope. Excluded on purpose:
      # TestKMSAAD_Wildcard_SingleSegmentOnly, TestKMSAAD_Wildcard_MiddleSegment
      # and TestKMSAAD_MatchService_SingleSegmentWildcard, which assume "*"
      # became single-segment; this branch keeps upstream "*" semantics and
      # adds the opt-in {name} placeholder instead (see the branch report).
      - name: Tagged proxy rule, echo and identity tests
        run: >-
          go test -race -count=1 -tags kmsaad ./internal/mitm/
          -run 'TestKMSAAD_(RetryPath_IdentityDescribesFinalCredential|PathNormalization_MatchesWhatIsForwarded|EchoScrub_ResponseHeadersBodyAndLogs|EchoScrub_RetryPath|WriteHold_PatchPagesRefused_GetAllowed|WriteHold_EmptyMethodsDeniesAll|HeaderHygiene_SpoofedIdentityStripped)$' -v

      - name: Tagged method contract tests
        run: >-
          go test -race -count=1 -tags kmsaad ./internal/broker/methodcontract/
          -run 'TestKMSAAD_(MatchService_MethodAllowlist|MatchService_NilMethodsKeepsUpstreamBehaviour|MatchService_EmptyMethodsDeniesAll|MethodsRoundTripJSON|ValidateMethodsRejectsUnknownVerbs)$' -v

      - name: Tagged whoami and executor privilege tests
        run: >-
          go test -race -count=1 -tags kmsaad ./internal/server/
          -run 'TestKMSAAD_(ProxyWhoami|ExecutorTokenPrivilegeChecks)$' -v

  # Security-critical: always run on every PR (see go-test for rationale).
  go-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      # go:embed all:webdist needs the directory at compile time;
      # real Vite output is validated by the frontend-build job.
      - name: Stub webdist for go:embed
        run: |
          mkdir -p internal/server/webdist
          printf '<!doctype html><title>ci-stub</title>' > internal/server/webdist/index.html

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

  go-mod-tidy:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: go mod tidy && git diff --exit-code go.mod go.sum

  sdk-ts:
    needs: changes
    if: needs.changes.outputs.sdk_ts == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/sdk-typescript
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdks/sdk-typescript/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Single required status check. `if: always()` is mandatory — without it,
  # a skipped upstream job would mark this job as skipped, and a skipped
  # required check blocks merging.
  ci-summary:
    if: always()
    needs: [changes, frontend-build, go-test, go-test-proxy-policy, go-lint, go-mod-tidy, sdk-ts]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          FRONTEND_BUILD: ${{ needs.frontend-build.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_TEST_PROXY_POLICY: ${{ needs.go-test-proxy-policy.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          GO_MOD_TIDY: ${{ needs.go-mod-tidy.result }}
          SDK_TS: ${{ needs.sdk-ts.result }}
        run: |
          fail=0
          check() {
            case "$2" in
              success|skipped) echo "$1: $2" ;;
              *)               echo "$1: $2 (FAILED)"; fail=1 ;;
            esac
          }
          # `changes` must succeed — every other gate hangs off its outputs.
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES (must be success)"
            fail=1
          fi
          check frontend-build "$FRONTEND_BUILD"
          check go-test        "$GO_TEST"
          check go-test-proxy-policy "$GO_TEST_PROXY_POLICY"
          check go-lint        "$GO_LINT"
          check go-mod-tidy    "$GO_MOD_TIDY"
          check sdk-ts         "$SDK_TS"
          exit $fail
